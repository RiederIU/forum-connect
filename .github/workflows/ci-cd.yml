name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # 2.37.1
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
      - run: composer install --no-progress --no-interaction
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --no-progress

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # 2.37.1
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
          coverage: pcov
      - run: composer install --no-progress --no-interaction
      - run: vendor/bin/phpunit --testdox --coverage-text --coverage-clover=coverage.xml
      - name: Mindest-Coverage prüfen
        run: |
          php -r '
            $x = simplexml_load_file("coverage.xml");
            $m = $x->project->metrics;
            $pct = ((int) $m["coveredstatements"]) / max(1, (int) $m["statements"]) * 100;
            printf("Line-Coverage: %.2f%%\n", $pct);
            if ($pct < 25.0) {
                fwrite(STDERR, "Coverage unter der Mindestschwelle von 25 Prozent\n");
                exit(1);
            }
          '

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Image bauen (prüft die Baubarkeit bei jedem Pull Request und Push)
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:${{ github.sha }} .
      # Im PoC bewusst nicht blockierend (exit-code 0), damit geerbte Basis-Image-Befunde den Lauf nicht abbrechen
      - name: Trivy-Scan auf CVEs (CRITICAL und HIGH, nicht blockierend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: An Docker Hub anmelden (nur beim Push auf main, nicht bei Pull Requests)
        if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image hochladen (nur beim Push auf main, nicht bei Pull Requests)
        if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:${{ github.sha }}

  deploy-staging:
    needs: [build]
    # Event und Branch werden bewusst im Job selbst geprüft, damit der Schutz auch bei später erweiterten Triggern bestehen bleibt
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Geprüftes SHA-Image ziehen (noch nicht als :staging markieren)
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:${{ github.sha }}
      - name: Smoke-Test Staging vor dem Bereitstellen (Health-Endpoint + Startseite)
        run: |
          docker run -d --name forum-connect-staging -p 8080:80 \
            -e APP_ENV=staging \
            ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:${{ github.sha }}
          ok=0
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/health.php | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then echo "Staging-Smoke-Test fehlgeschlagen (Health-Endpoint nicht ok), Bereitstellung wird übersprungen"; exit 1; fi
          curl -fsS http://localhost:8080/ | grep -q 'Forumsübersicht' \
            || { echo "Staging-Smoke-Test fehlgeschlagen (Startseite ohne erwarteten Inhalt)"; exit 1; }
          echo "Staging-Smoke-Test bestanden: Health-Endpoint ok und Startseite gerendert"
      - name: Unter :staging veröffentlichen (erst nach bestandenem Smoke-Test)
        run: |
          docker tag  ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:${{ github.sha }} \
                      ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:staging
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:staging
      - name: Staging-Protokoll bei Fehler
        if: failure()
        run: docker logs forum-connect-staging
      - name: Staging aufräumen
        if: always()
        run: docker stop forum-connect-staging && docker rm forum-connect-staging

  deploy-production:
    needs: [deploy-staging]
    # Mit einer eigenen if-Bedingung greift die Skip-Weitergabe über needs nicht mehr, daher steht die vollständige Bedingung bewusst auch auf diesem Job
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Geprüftes SHA-Image ziehen (noch nicht als :production markieren)
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:${{ github.sha }}
      - name: Smoke-Test Production vor der Veröffentlichung (Health-Endpoint + Startseite)
        run: |
          docker run -d --name forum-connect-production -p 8081:80 \
            -e APP_ENV=production \
            ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:${{ github.sha }}
          ok=0
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8081/health.php | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then echo "Production-Smoke-Test fehlgeschlagen (Health-Endpoint nicht ok), Veröffentlichung wird übersprungen"; exit 1; fi
          curl -fsS http://localhost:8081/ | grep -q 'Forumsübersicht' \
            || { echo "Production-Smoke-Test fehlgeschlagen (Startseite ohne erwarteten Inhalt)"; exit 1; }
          echo "Production-Smoke-Test bestanden: Health-Endpoint ok und Startseite gerendert"
      - name: Nach :production veröffentlichen (erst nach bestandenem Smoke-Test)
        run: |
          docker tag  ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:${{ github.sha }} \
                      ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:production
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/forum-connect:production
      - name: Production-Protokoll bei Fehler
        if: failure()
        run: docker logs forum-connect-production
      - name: Production aufräumen
        if: always()
        run: docker stop forum-connect-production && docker rm forum-connect-production
